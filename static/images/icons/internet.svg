<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <filter id="shadow-internet" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.10" />
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.05" />
    </filter>
  </defs>

  <!-- Big White Squircle Tile -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="#ffffff" filter="url(#shadow-internet)" />

  <!-- Thick Network Bus Highways -->
  <line x1="26" y1="28" x2="52" y2="52" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" />
  <line x1="52" y1="52" x2="76" y2="30" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" />
  <line x1="52" y1="52" x2="32" y2="76" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" />
  <line x1="52" y1="52" x2="75" y2="74" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" stroke-dasharray="3 7" />
  <line x1="32" y1="76" x2="75" y2="74" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" />

  <!-- Traveling Data Packet Pulses -->
  <circle cx="39" cy="40" r="4" fill="#38bdf8" />
  <circle cx="64" cy="41" r="4" fill="#fbbf24" />
  <circle cx="53" cy="75" r="3.5" fill="#34d399" />

  <!-- Node 1: Top-Left Cyan (ARPANET Interface Message Processor) -->
  <circle cx="26" cy="28" r="14" fill="#06b6d4" />
  <circle cx="26" cy="28" r="6" fill="#ffffff" />

  <!-- Node 2: Center Main Host Hub -->
  <circle cx="52" cy="52" r="17" fill="#2563eb" />
  <circle cx="52" cy="52" r="8.5" fill="#ffffff" />
  <circle cx="52" cy="52" r="4" fill="#1e40af" />

  <!-- Node 3: Top-Right Amber (Gateway Node) -->
  <circle cx="76" cy="30" r="13" fill="#f59e0b" />
  <circle cx="76" cy="30" r="5.5" fill="#ffffff" />

  <!-- Node 4: Bottom-Left Indigo (Terminal Server) -->
  <circle cx="32" cy="76" r="13" fill="#6366f1" />
  <circle cx="32" cy="76" r="5.5" fill="#ffffff" />

  <!-- Node 5: Bottom-Right Emerald (Remote Supercomputer) -->
  <circle cx="75" cy="74" r="11" fill="#10b981" />
  <circle cx="75" cy="74" r="4.5" fill="#ffffff" />
</svg>
