<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <filter id="shadow-web" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.10" />
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.05" />
    </filter>
  </defs>

  <!-- Big White Squircle Tile -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="#ffffff" filter="url(#shadow-web)" />

  <!-- Big Odoo Website Globe - Upper Wave Sweep (Cyan #00b4d8) -->
  <path d="M 21 46 C 22 30 35 18 50 18 C 65 18 78 30 79 46 C 71 41 61 38 50 42 C 39 46 29 47 21 46 Z" fill="#00b4d8" />

  <!-- Big Odoo Website Globe - Lower Wave Sweep (Deep Cobalt/Royal Blue #1e40af) -->
  <path d="M 21 54 C 29 53 39 54 50 50 C 61 46 71 49 79 54 C 78 70 65 82 50 82 C 35 82 22 70 21 54 Z" fill="#1e40af" />

  <!-- Hyperlink Latitude Ring (Subtle Translucent Web Orbit) -->
  <ellipse cx="50" cy="50" rx="34" ry="12" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.6" transform="rotate(-15 50 50)" />
</svg>
