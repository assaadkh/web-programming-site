<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <filter id="shadow-prof" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.10" />
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.05" />
    </filter>
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
  </defs>

  <!-- Big White Squircle Tile -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="#ffffff" filter="url(#shadow-prof)" />

  <!-- ID Card Container (Bold & Centered) -->
  <rect x="22" y="18" width="56" height="64" rx="12" fill="url(#badge-grad)" />

  <!-- Lanyard / Clip Hole -->
  <rect x="42" y="14" width="16" height="7" rx="3.5" fill="#042f2e" />
  <circle cx="50" cy="17.5" r="2.5" fill="#ffffff" />

  <!-- Student Graduation Cap (Academic Scholar) -->
  <polygon points="50,26 68,33 50,40 32,33" fill="#f59e0b" />
  <!-- Cap Tassel -->
  <path d="M 62,35 L 64,44" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="64" cy="45" r="1.5" fill="#fbbf24" />

  <!-- Student Avatar (Head & Shoulders in Pure White) -->
  <circle cx="50" cy="47" r="7" fill="#ffffff" />
  <path d="M 36 68 C 36 57 42 56 50 56 C 58 56 64 57 64 68 Z" fill="#ffffff" />

  <!-- Engineering ID / Data Track Lines at Bottom -->
  <rect x="36" y="72" width="28" height="3" rx="1.5" fill="#5eead4" opacity="0.9" />
</svg>
