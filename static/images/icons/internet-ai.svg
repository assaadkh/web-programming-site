<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <filter id="shadow-ai-net" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4.5" flood-color="#0f172a" flood-opacity="0.10" />
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.05" />
    </filter>
  </defs>

  <!-- Big White Squircle Tile -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="#ffffff" filter="url(#shadow-ai-net)" />

  <!-- Thick Synaptic Pathways -->
  <line x1="26" y1="26" x2="50" y2="50" stroke="#c084fc" stroke-width="6" stroke-linecap="round" />
  <line x1="74" y1="26" x2="50" y2="50" stroke="#c084fc" stroke-width="6" stroke-linecap="round" />
  <line x1="50" y1="50" x2="26" y2="74" stroke="#c084fc" stroke-width="6" stroke-linecap="round" />
  <line x1="50" y1="50" x2="74" y2="74" stroke="#c084fc" stroke-width="6" stroke-linecap="round" />

  <!-- Synaptic Satellite Nodes -->
  <circle cx="26" cy="26" r="12" fill="#06b6d4" />
  <circle cx="26" cy="26" r="5" fill="#ffffff" />

  <circle cx="74" cy="26" r="12" fill="#d946ef" />
  <circle cx="74" cy="26" r="5" fill="#ffffff" />

  <circle cx="26" cy="74" r="12" fill="#3b82f6" />
  <circle cx="26" cy="74" r="5" fill="#ffffff" />

  <circle cx="74" cy="74" r="12" fill="#f97316" />
  <circle cx="74" cy="74" r="5" fill="#ffffff" />

  <!-- Big Central Neural AI Core Hub -->
  <circle cx="50" cy="50" r="19" fill="#7c3aed" />

  <!-- 4-Point AI Sparkle Star Core -->
  <path d="M 50 37 Q 50 50 37 50 Q 50 50 50 63 Q 50 50 63 50 Q 50 50 50 37 Z" fill="#ffffff" />
  <circle cx="50" cy="50" r="2.5" fill="#22d3ee" />
</svg>
